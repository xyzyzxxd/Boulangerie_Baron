<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />

    <title>Nos viennoiseries - Business Casual</title>

    <link rel="icon" type="image/x-icon" th:href="@{/assets/favicon.ico}" />

    <!-- Google fonts -->
    <link
      href="https://fonts.googleapis.com/css?family=Raleway:100,100i,200,200i,300,300i,400,400i,500,500i,600,600i,700,700i,800,800i,900,900i"
      rel="stylesheet"
    />

    <link
      href="https://fonts.googleapis.com/css?family=Lora:400,400i,700,700i"
      rel="stylesheet"
    />

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- CSS -->
    <link th:href="@{/css/styles.css}" rel="stylesheet" />

    <style>
      body {
  background-color: #faf7f2;
}

/* CONTAINER */
.container.py-4 {
  max-width: 1400px;
}

/* =========================
   TITRE
========================= */
.title-box {
  background: white;
  padding: 60px;
  border-radius: 20px;
  max-width: 900px;
  margin: auto;
  box-shadow: 0 15px 35px rgba(0, 0, 0, 0.12);
}

.title-upper {
  display: block;
  color: #a66a3f;
  font-size: 1.2rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 3px;
}

.title-main {
  font-size: 4rem;
  font-weight: 800;
  color: #3b2f2f;
  margin: 15px 0;
}

.title-sub {
  color: #666;
  font-size: 1.1rem;
  margin-bottom: 0;
}

/* =========================
   CARDS
========================= */
.product-card {
  border-radius: 14px;
  overflow: hidden;
  background: #fff;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
  height: 100%;
}

.product-card:hover {
  transform: translateY(-6px);
  box-shadow: 0 12px 25px rgba(0, 0, 0, 0.12);
}

/* IMAGE SANS ROGNAGE */
.product-img {
  width: 100%;
  height: auto;
  display: block;
}

/* BODY */
.card-body {
  padding: 1rem;
  display: flex;
  flex-direction: column;
  text-align: center;
}

.card-title {
  font-weight: 600;
  font-size: 1.1rem;
  color: #3b2f2f;
}

.card-text {
  font-size: 0.9rem;
  color: #6b5b4f;
  line-height: 1.4;
}

/* CATÉGORIE */
.product-category {
  color: #a66a3f;
  font-size: 0.8rem;
  text-transform: uppercase;
  letter-spacing: 1px;
  font-weight: 700;
  margin-bottom: 5px;
}

/* GRILLE */
.row {
  justify-content: center;
  row-gap: 25px;
}
    </style>
  </head>

  <body>
    <!-- HEADER -->
    <div th:replace="fragments/header :: header"></div>

    <!-- TITRE -->
    <section class="page-section clearfix">
      <div class="container text-center">
        <h1 class="section-heading mb-5">
          <span class="section-heading-upper">
            Pâtisserie & boulangerie artisanale
          </span>

          <span class="section-heading-lower"> Nos produits salés </span>
        </h1>
      </div>
    </section>

    <!-- PRODUITS -->
    <section class="page-section">
      <div class="container">
        <div class="row g-4">
          <!-- Produit 1 -->
          <div class="col-lg-3 col-md-4 col-sm-6">
            <div class="card product-card h-100 shadow-sm border-0">
              <img
                th:src="@{/assets/img/sale/fougasses.jpg}"
                class="card-img-top product-img"
                alt="Fougasse"
              />

              <div class="card-body text-center">
                <h5 class="card-title">Fougasses</h5>

                <p class="card-text">
                  Fougasse croustillante et parfumée.
                </p>
              </div>
            </div>
          </div>

          <!-- Produit 2 -->
          <div class="col-lg-3 col-md-4 col-sm-6">
            <div class="card product-card h-100 shadow-sm border-0">
              <img
                th:src="@{/assets/img/sale/pizzas.jpg}"
                class="card-img-top product-img"
                alt="Pizzas"
              />

              <div class="card-body text-center">
                <h5 class="card-title">Pizzas</h5>

                <p class="card-text">
                  Pizzas artisanales avec des ingrédients frais.
                </p>
              </div>
            </div>
          </div>

          <!-- Produit 3 -->
          <div class="col-lg-3 col-md-4 col-sm-6">
            <div class="card product-card h-100 shadow-sm border-0">
              <img
                th:src="@{/assets/img/sale/fougasse_chorizo.jpg}"
                class="card-img-top product-img"
                alt="Fougasse au chorizo"
              />

              <div class="card-body text-center">
                <h5 class="card-title">Fougasse au chorizo</h5>

                <p class="card-text">
                  Fougasse parfumée avec du chorizo et des herbes.
                </p>
              </div>
            </div>
          </div>

          <!-- Produit 4 -->
          <div class="col-lg-3 col-md-4 col-sm-6">
            <div class="card product-card h-100 shadow-sm border-0">
              <img
                th:src="@{/assets/img/sale/pizza_chevre.jpg}"
                class="card-img-top product-img"
                alt="Pizza au chèvre"
              />

              <div class="card-body text-center">
                <h5 class="card-title">Pizza au chèvre</h5>

                <p class="card-text">
                  Pizza artisanale avec du chèvre et des herbes.
                </p>
              </div>
            </div>
          </div>
    </section>

    <!-- FOOTER -->
    <div th:replace="fragments/footer :: footer"></div>

    <!-- JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>

    <script th:src="@{/js/scripts.js}"></script>
  </body>
</html>
