<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />

    <title>Contact - Boulangerie artisanale</title>

    <link rel="icon" type="image/x-icon" th:href="@{/assets/favicon.ico}" />

    <!-- Google fonts -->
    <link
      href="https://fonts.googleapis.com/css?family=Raleway:100,100i,200,200i,300,300i,400,400i,500,500i,600,600i,700,700i,800,800i,900,900i"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Lora:400,400i,700,700i"
      rel="stylesheet"
    />

    <link th:href="@{/css/styles.css}" rel="stylesheet" />

    <style>
      body {
        background-color: #faf7f2;
      }

      .container-custom {
        max-width: 1100px;
        margin: auto;
      }

      /* TITLE */
      .title-box {
        background: white;
        padding: 60px;
        border-radius: 20px;
        text-align: center;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.12);
        margin-bottom: 40px;
      }

      .title-upper {
        display: block;
        color: #a66a3f;
        font-size: 1.2rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 3px;
      }

      .title-main {
        font-size: 3.5rem;
        font-weight: 800;
        color: #3b2f2f;
        margin: 15px 0;
      }

      .title-sub {
        color: #666;
        font-size: 1.1rem;
      }

      /* CONTACT CARD */
      .contact-card {
        background: white;
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      }

      .contact-card input,
      .contact-card textarea {
        width: 100%;
        padding: 12px;
        margin-bottom: 15px;
        border-radius: 8px;
        border: 1px solid #ddd;
      }

      .contact-card button {
        background-color: #3b2f2f;
        color: white;
        padding: 12px 20px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: 0.2s;
        width: 100%;
        font-weight: 600;
      }

      .contact-card button:hover {
        background-color: #a66a3f;
      }

      /* INFO BOX */
      .info-box {
        background: #fff;
        padding: 25px;
        border-radius: 15px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        height: 100%;
      }

      .info-title {
        font-weight: 700;
        margin-bottom: 10px;
        color: #3b2f2f;
      }

      .info-text {
        color: #666;
        margin-bottom: 15px;
      }
    </style>
  </head>

  <body>
    <!-- HEADER -->
    <div th:replace="fragments/header :: header"></div>

    <!-- TITRE -->
    <section class="page-section">
      <div class="container container-custom">

        <div class="title-box">
          <span class="title-upper">Boulangerie artisanale</span>
          <div class="title-main">Contactez-nous</div>
          <div class="title-sub">
            Une question, une demande spéciale ? Nous vous répondons rapidement.
          </div>
        </div>

        <div class="row g-4">

          <!-- FORMULAIRE -->
          <div class="col-md-7">
            <div class="contact-card">

              <form action="https://formspree.io/f/xjgzdjbb" method="POST">
              <input type="text" name="Nom" placeholder="Nom" required />

              <input type="email" name="Mail" placeholder="Email" required />

<textarea name="Message" placeholder="Message" required></textarea>

<button type="submit">Envoyer</button>
              </form>

            </div>
          </div>

          <!-- INFOS -->
          <div class="col-md-5">
            <div class="info-box">

              <div class="info-title">📍 Adresse</div>
              <div class="info-text">
                14 rue Georges Clemenceau<br />
                39160 Saint-Amour
              </div>

              <div class="info-title">📞 Téléphone</div>
              <div class="info-text">
                03 84 48 72 69
              </div>

              <div class="info-title">⏰ Horaires</div>
              <div class="info-text">
                Mardi - Samedi : 6h30 - 12h45    14h - 18h45<br />
                Dimanche : 7h - 12h45
              </div>

            </div>
          </div>

        </div>
      </div>
    </section>

    <!-- FOOTER -->
    <div th:replace="fragments/footer :: footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
