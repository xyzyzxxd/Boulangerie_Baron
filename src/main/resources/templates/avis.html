<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />

    <title>Avis clients - Boulangerie artisanale</title>

    <link rel="icon" type="image/x-icon" th:href="@{/assets/favicon.ico}" />

    <!-- Google fonts -->
    <link
      href="https://fonts.googleapis.com/css?family=Raleway:100,100i,200,200i,300,300i,400,400i,500,500i,600,600i,700,700i,800,800i,900,900i"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Lora:400,400i,700,700i"
      rel="stylesheet"
    />

    <link th:href="@{/css/styles.css}" rel="stylesheet" />

    <style>
      /* BACKGROUND */
      body {
        background-color: #faf7f2;
      }

      /* CONTAINER */
      .container-custom {
        max-width: 1100px;
        margin: auto;
      }

      /* TITRE */
      .title-box {
        background: white;
        padding: 60px;
        border-radius: 20px;
        text-align: center;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.12);
        margin-bottom: 40px;
      }

      .title-upper {
        display: block;
        color: #a66a3f;
        font-size: 1.2rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 3px;
      }

      .title-main {
        font-size: 3.5rem;
        font-weight: 800;
        color: #3b2f2f;
        margin: 15px 0;
      }

      .title-sub {
        color: #666;
        font-size: 1.1rem;
      }

      /* FORM */
      .review-form {
        background: white;
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        margin-bottom: 40px;
      }

      .review-form input,
      .review-form textarea,
      .review-form select {
        width: 100%;
        padding: 12px;
        margin-bottom: 15px;
        border-radius: 8px;
        border: 1px solid #ddd;
      }

      .review-form button {
        background-color: #3b2f2f;
        color: white;
        padding: 12px 20px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: 0.2s;
        width: 100%;
        font-weight: 600;
      }

      .review-form button:hover {
        background-color: #a66a3f;
      }

      /* AVIS */
      .review-card {
        background: white;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
        margin-bottom: 15px;
      }

      .stars {
        color: #a66a3f;
        font-weight: bold;
        margin-bottom: 5px;
      }

      .anon {
        font-size: 0.8rem;
        color: #888;
        margin-bottom: 10px;
      }
    </style>
  </head>

  <body>
    <!-- HEADER -->
    <div th:replace="fragments/header :: header"></div>

    <!-- TITRE -->
    <section class="page-section">
      <div class="container container-custom">

        <div class="title-box">
          <span class="title-upper">Boulangerie artisanale</span>
          <div class="title-main">Vos avis</div>
          <div class="title-sub">
            Tous les avis sont anonymes et nous aident à nous améliorer chaque jour.
          </div>
        </div>

        <!-- MESSAGE SUCCESS -->
        <div th:if="${param.success}" style="color: green; text-align:center; margin-bottom: 20px;">
          ✔ Votre avis a bien été envoyé !
        </div>

        <!-- FORMULAIRE -->
        <div class="review-form">
          <form method="post" th:action="@{/avis}">

            <label>Note</label>
            <select name="note" required>
              <option value="5">★★★★★ Excellent</option>
              <option value="4">★★★★☆ Très bien</option>
              <option value="3">★★★☆☆ Bien</option>
              <option value="2">★★☆☆☆ Moyen</option>
              <option value="1">★☆☆☆☆ Déçu</option>
            </select>

            <label>Votre message</label>
            <textarea name="message" rows="4" placeholder="Votre avis..." required></textarea>

            <button type="submit">Envoyer anonymement</button>
          </form>
        </div>

      </div>
    </section>

    <!-- FOOTER -->
    <div th:replace="fragments/footer :: footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
